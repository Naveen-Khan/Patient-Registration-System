{% extends "base.html" %}
{% block content %}
<div class="hero">
    <h2>Welcome to Patient Registration System</h2>
    <p>Voice-powered patient registration with AI assistance</p>
    <a href="{{ url_for('patients') }}" class="btn btn-primary">View All Patients</a>
    <a href="#add-form" class="btn btn-secondary">Register New Patient</a>
</div>

<div class="stats">
    <div class="stat-card">
        <h3 id="total-count">Loading...</h3>
        <p>Total Patients</p>
    </div>
    <div class="stat-card">
        <h3>Quick Access</h3>
        <p>Manage patients</p>
    </div>
</div>

<div id="add-form" class="card">
    <h3>Register New Patient</h3>
    <form method="POST" action="{{ url_for('add_patient') }}">
        <div class="form-grid">
            <div class="form-group">
                <label>First Name *</label>
                <input type="text" name="first_name" required maxlength="50">
            </div>
            <div class="form-group">
                <label>Last Name *</label>
                <input type="text" name="last_name" required maxlength="50">
            </div>
            <div class="form-group">
                <label>Date of Birth *</label>
                <input type="text" name="date_of_birth" placeholder="MM/DD/YYYY" required>
            </div>
            <div class="form-group">
                <label>Sex *</label>
                <select name="sex" required>
                    <option value="">Select...</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                    <option value="Decline to Answer">Decline to Answer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Phone Number *</label>
                <input type="text" name="phone_number" placeholder="10-digit phone" required maxlength="15">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email">
            </div>
            <div class="form-group">
                <label>Address Line 1 *</label>
                <input type="text" name="address_line_1" required maxlength="200">
            </div>
            <div class="form-group">
                <label>City *</label>
                <input type="text" name="city" required maxlength="100">
            </div>
            <div class="form-group">
                <label>State *</label>
                <select name="state" required>
                    <option value="">Select...</option>
                    {% for state in US_STATES %}
                    <option value="{{ state }}">{{ state }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>ZIP Code *</label>
                <input type="text" name="zip_code" placeholder="XXXXX or XXXXX-XXXX" required maxlength="10">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Register Patient</button>
    </form>
</div>
{% endblock %}
